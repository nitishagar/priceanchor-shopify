name: CI
on: [push, pull_request]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to v1.6.0 (MIT): v2 enforces a GITLEAKS_LICENSE whenever its
      # org/user check fails (e.g. API rate limit), failing CI on a personal
      # repo. v1 takes the config as an input, not GITLEAKS_CONFIG.
      - uses: gitleaks/gitleaks-action@v1.6.0
        with:
          config-path: .gitleaks.toml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Enforce single origin
        run: bash scripts/check-origin.sh

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Re-generate migrations from schema
        run: npx drizzle-kit generate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
      - name: Fail if drizzle/ is out of sync with app/db/schema.ts
        run: git diff --exit-code drizzle/

  migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Apply migrations (first run)
        run: npm run db:migrate:pg
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - name: Re-apply migrations (idempotency check)
        run: npm run db:migrate:pg
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
