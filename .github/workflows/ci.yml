name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
      - run: npm ci
      - name: Re-generate migrations from schema
        run: npx drizzle-kit generate
        env:
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
      - name: Fail if drizzle/ is out of sync with app/db/schema.ts
        run: git diff --exit-code drizzle/

  migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"
      - run: npm ci
      - name: Apply migrations (first run)
        run: npm run db:migrate:pg
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - name: Re-apply migrations (idempotency check)
        run: npm run db:migrate:pg
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
